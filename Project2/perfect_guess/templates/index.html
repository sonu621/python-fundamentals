<!DOCTYPE html>
<html>
<head>
    <title>Perfect Guess Game</title>
</head>
<body>
    <h1>Perfect Guess Game</h1>
    <p>You have 5 attempts to guess the number (1–100)</p>

    <form method="POST">
        <input type="number" name="guess" required>
        <button type="submit">Submit</button>
    </form>

    <h2>{{ message }}</h2>
</body>
</html>
